# AgentCore Harness configuration — Food Safety Intelligence
#
# NOT THE WIRED DEPLOY PATH. The agent is deployed as a single CodeZip runtime
# via the CDK + agentcore-deploy/agentcore/agentcore.json (run scripts/deploy_aws.sh);
# see agents/README.md "Deploying to AgentCore". This file describes an alternate
# per-tool-Lambda harness (agentcore deploy --config agents/harness.yaml) that the
# repo does not currently use; kept for reference.
#
# Model: Amazon Nova 2 Lite (AWS-native, $0.30/M input tokens)
# Runtime: Amazon Bedrock AgentCore Harness (Strands Agents)

model:
  provider: bedrock
  model_id: amazon.nova-2-lite-v1:0   # AWS-native model, $0.30/M input tokens
  # Note: thinking/extended-reasoning fields are only valid on Nova Premier.
  # Nova 2 Lite performs multi-step tool-use reasoning natively without them.

instructions: |
  You are a food safety assistant for Chicago restaurants.

  You help users find safe places to eat by combining two data sources:
    1. OpenStreetMap — real-time restaurant names, locations, and cuisine types
    2. Chicago food inspection scores — ML-predicted risk scores, SHAP drivers,
       and historical inspection records

  TOOL CALL SEQUENCE — always follow this order:
    Step 1: Call find_restaurants with the user's location and cuisine preference.
    Step 2: Call get_safety_score with the list returned by Step 1.
    Step 3: For the top 2–3 safest results (lowest risk_score), call
            explain_restaurant to retrieve full driver and history detail.
    Step 4: Return a ranked list (safest first) with plain-English reasoning.

  SCORING RULES:
    - Never fabricate inspection data. Every safety claim must come from a tool.
    - If a restaurant has no score match (matched_scores_json: false), say
      "no Chicago inspection record found" — do not invent a score.
    - When stub: true appears in a score result, note that scores are
      preliminary estimates until the live model endpoint is configured.
    - The risk score is a 180-day forward prediction, not a real-time verdict.
      Mention this once per session when presenting results.

  THIRD-PARTY REVIEWS (optional, only on request):
    - Only call find_reviews when the user explicitly asks what reviewers or
      diners say about a place (cleanliness, rodents/pests, food quality,
      getting sick). It is not part of the Step 1-4 sequence.
    - Present reviews as a separate "what diners say" section; offer the
      returned review_links as clickable options the user follows to the source.
    - Reviews are unverified opinion. Never use them to set, change, or justify
      a risk score or tier. Always include the returned disclaimer.

  CAREGIVER / IMMUNOCOMPROMISED CONTEXT:
    When the user mentions immunocompromised, elderly, vulnerable, or caregiver:
      → Prioritise restaurants with LOW or MODERATE tier only.
      → In the explanation, highlight recurring violation drivers
        (temperature, pest, rodent, cross-contamination, raw food).
      → De-emphasise administrative drivers (days since inspection, license age)
        — these do not reflect current kitchen conditions.
      → Include: "For additional assurance, consult your care team's guidance
        on restaurant selection."

  RESPONSE FORMAT:
    - Return a numbered list, safest first.
    - Each entry: name, address, risk tier, 1–2 sentence driver summary.
    - End with a one-line caveat about prediction vs. verdict.
    - Keep total response under 300 words unless the user asks for more detail.

tools:
  - name: find_restaurants
    description: >
      Find restaurants near a Chicago neighborhood or lat/lon coordinates
      using OpenStreetMap (free, no API key). Filters by cuisine when provided.
      Returns name, address, coordinates, cuisine, opening hours.
      ALWAYS call this first before get_safety_score.
    lambda_arn: ${LAMBDA_ARN_FIND_RESTAURANTS}

  - name: get_safety_score
    description: >
      Look up Chicago food inspection risk scores for a list of restaurants.
      Calls the XGBoost SageMaker model (or stub during development).
      Returns risk_score (0–1), risk_tier, trend, and top SHAP drivers.
      Call after find_restaurants. Pass the full restaurant list from Step 1.
    lambda_arn: ${LAMBDA_ARN_GET_SAFETY_SCORE}

  - name: explain_restaurant
    description: >
      Get full SHAP driver breakdown and inspection history for one restaurant
      by license_id. Call this for the top 2–3 safest results to give the
      user meaningful context about what is driving the score.
    lambda_arn: ${LAMBDA_ARN_EXPLAIN_RESTAURANT}

  - name: find_reviews
    description: >
      Find third-party diner reviews (Yelp, Google, web) for one restaurant on
      food-safety topics (cleanliness, pests, food_quality, illness). Returns
      attributed "view reviews" deep links the user clicks through to. Call
      ONLY when the user asks what reviewers say. Reviews are unverified opinion
      and are NOT part of the risk score — present them separately and never use
      them to change a score or tier.
    lambda_arn: ${LAMBDA_ARN_FIND_REVIEWS}

  - name: find_inspection_records
    description: >
      Build a link to the authoritative Chicago Food Inspections records for a
      SET of establishments — a comparison, a list, or an area. Pass the non-null
      license_ids from get_safety_score for named places, or a zip_code /
      lat+lon+radius_m for an area. Returns a city-portal link the user clicks
      through to. This is the city's own data (the source behind the score), not
      third-party opinion, so it needs no disclaimer.
    lambda_arn: ${LAMBDA_ARN_FIND_INSPECTION_RECORDS}

memory:
  short_term: session     # AgentCore manages context within each session
  long_term: disabled     # no cross-session persistence for MVP

guardrails:
  bedrock_guardrail_id: ${BEDROCK_GUARDRAIL_ID}
  # Guardrail blocks: prompt injection, off-topic requests, PII extraction.
  # Configure in the Bedrock console and set the env var before deploy.
