name: Deploy web app

# Publishes the Next.js static export (app/out) to the CloudFront-fronted S3
# site, restoring "merge to main = publish". This replaces the retired Amplify
# auto-deploy. The build reads the committed app/public/data JSON, so whatever is
# on main is exactly what goes live — no model call, no live data fetch.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-web.yml"
  # Manual runs let us re-publish without an app/ change — e.g. after refreshing
  # the data in S3 on its own.
  workflow_dispatch: {}

# One deploy at a time; never interrupt a half-finished S3 sync.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  id-token: write # mint the OIDC token AWS exchanges for temporary creds
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WEB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Creds are configured BEFORE the build so the prebuild step can pull data
      # from S3 — critically the gitignored comment shards, which have no
      # committed fallback (scores.json/inspection_history.json still fall back
      # to their committed copies if S3 is unavailable). Requires the deploy role
      # to have s3:GetObject on the data bucket, not just the website bucket.
      - name: Build static export
        run: npm run build

      # Content-hashed build assets (_next/static/**) are immutable: the filename
      # changes whenever the bytes change, so they can cache forever. --delete is
      # scoped to this prefix, cleaning out chunks from prior builds.
      - name: Upload immutable build assets to S3
        run: aws s3 sync out/_next/static "s3://${{ vars.WEBSITE_BUCKET }}/_next/static" --delete --cache-control "public,max-age=31536000,immutable"

      # Everything else — HTML shells and the data JSON (search-index, methodology,
      # per-city scores) — shares a STABLE url, so without a revalidation directive
      # browsers heuristically cache it and keep showing stale data after a
      # republish (this is what made a detail page's risk tier lag the map's). Set
      # `no-cache` so clients always revalidate against the ETag: unchanged files
      # return a tiny 304, changed data is picked up immediately, no hard refresh.
      # The immutable assets above and the ~23.6k per-license detail bundles are
      # EXCLUDED (excluded keys are also exempt from --delete); the bundles are
      # byte-identical across code-only deploys and handled by the content-aware
      # step below, so re-uploading all of them every time is pure waste.
      - name: Upload app shell + data to S3
        run: aws s3 sync out/ "s3://${{ vars.WEBSITE_BUCKET }}/" --delete --exclude "_next/static/*" --exclude "data/detail/*" --exclude "data/nyc/detail/*" --exclude "data/la/detail/*" --cache-control "no-cache"

      # Upload only the detail bundles whose content actually changed (md5 vs the
      # live object ETag), and delete bundles for licenses that no longer exist.
      # One call per city — both detail trees are excluded from the plain sync above.
      - name: Upload changed detail bundles to S3
        run: node scripts/sync-detail-s3.mjs out/data/detail "${{ vars.WEBSITE_BUCKET }}" "data/detail/"

      - name: Upload changed NYC detail bundles to S3
        run: node scripts/sync-detail-s3.mjs out/data/nyc/detail "${{ vars.WEBSITE_BUCKET }}" "data/nyc/detail/"

      - name: Upload changed LA detail bundles to S3
        run: node scripts/sync-detail-s3.mjs out/data/la/detail "${{ vars.WEBSITE_BUCKET }}" "data/la/detail/"

      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          --paths '/*'
