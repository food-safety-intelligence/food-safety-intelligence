name: Deploy web app

# Publishes the Next.js static export (app/out) to the CloudFront-fronted S3
# site, restoring "merge to main = publish". This replaces the retired Amplify
# auto-deploy. The build reads the committed app/public/data JSON, so whatever is
# on main is exactly what goes live — no model call, no live data fetch.

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy-web.yml"
  # Manual runs let us re-publish without an app/ change — e.g. after refreshing
  # the data in S3 on its own.
  workflow_dispatch: {}

# One deploy at a time; never interrupt a half-finished S3 sync.
concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  id-token: write # mint the OIDC token AWS exchanges for temporary creds
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WEB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Creds are configured BEFORE the build so the prebuild step can pull data
      # from S3 — critically the gitignored comment shards, which have no
      # committed fallback (scores.json/inspection_history.json still fall back
      # to their committed copies if S3 is unavailable). Requires the deploy role
      # to have s3:GetObject on the data bucket, not just the website bucket.
      - name: Build static export
        run: npm run build

      # Sync the app shell (HTML, JS/CSS chunks, the small data JSONs) with the
      # plain mtime-based sync — it is small and changes on every code deploy.
      # The ~23.6k per-license detail bundles are EXCLUDED here (excluded keys
      # are also exempt from --delete) and handled by the content-aware step
      # below: they are byte-identical across code-only deploys, so re-uploading
      # all of them every time (mtime always changes on rebuild) is pure waste.
      - name: Upload app shell to S3
        run: aws s3 sync out/ "s3://${{ vars.WEBSITE_BUCKET }}/" --delete --exclude "data/detail/*"

      # Upload only the detail bundles whose content actually changed (md5 vs the
      # live object ETag), and delete bundles for licenses that no longer exist.
      - name: Upload changed detail bundles to S3
        run: node scripts/sync-detail-s3.mjs out/data/detail "${{ vars.WEBSITE_BUCKET }}" "data/detail/"

      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          --paths '/*'
