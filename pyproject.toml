[project]
name = "foodsafety"
version = "0.1.0"
description = "Food Safety Intelligence — Chicago capstone (UC Berkeley MIDS)"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "streamlit>=1.32",
    "plotly>=5.20",
    "pydeck>=0.8",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    # Agentic AI pipeline (agents/run_local.py)
    "strands-agents>=0.1",
    "boto3>=1.43.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "diff-cover>=9.0",
    "ruff>=0.4",
    "nbstripout>=0.7",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodsafety"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are exploratory and follow the nbstripout convention, not
# library-code lint rules. Imports-after-markdown (E402), one-liners (E701/E702),
# etc. are normal in cells — linting them as if they were package modules just
# generates churn on every notebook edit. The package, scripts, tests, and
# agents are linted; notebooks are not.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# Coverage is measured and reported. CI applies an 80% total floor and an 85%
# floor on changed lines (diff-cover) — but both run as NON-BLOCKING steps (they
# annotate, they don't fail the merge). Deliberately NO fail_under here, so the
# main pytest run never goes red on coverage; the floor lives in its own step.
# Run locally with: uv run pytest --cov
[tool.coverage.run]
source = ["src/foodsafety"]
branch = true
# Store paths relative to the repo root so the PR-comment action can map
# coverage data to changed files (and compute per-file diff coverage).
relative_files = true
# Untestable-by-design: peek() is a notebook display helper (prints a profile);
# exercising it would assert on stdout for no real safety. Excluded so the floor
# reflects testable code.
omit = ["src/foodsafety/utils/peek.py"]

[tool.coverage.report]
show_missing = true

[tool.uv.workspace]
members = [
    "food-safety-intelligence",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]
