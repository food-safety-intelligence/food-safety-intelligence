[project]
name = "foodsafety"
version = "0.1.0"
description = "Food Safety Intelligence — Chicago capstone (UC Berkeley MIDS)"
requires-python = ">=3.11,<3.13"

dependencies = [
    "pandas>=2.2",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "shap>=0.45",
    "streamlit>=1.32",
    "plotly>=5.20",
    "pydeck>=0.8",
    "matplotlib>=3.8",
    "joblib>=1.3",
    "python-dotenv>=1.0",
    # Agentic AI pipeline (agents/run_local.py)
    "strands-agents>=0.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "nbstripout>=0.7",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foodsafety"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.uv.workspace]
members = [
    "food-safety-intelligence",
]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]
